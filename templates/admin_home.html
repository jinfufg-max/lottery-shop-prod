<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>管理後台</title>
</head>
<body>

<h1>📊 管理後台</h1>

<hr>

<h2>系統總覽</h2>

<div style="margin:20px 0;">

    <a href="/admin/download/shopdb" ...>
       📥 下載 shop.db
    </a>

    <a href="/admin/download/lotterydb" ...>
       📥 下載 lottery_v2.db
    </a>

</div>

<h3>上傳 shop.db</h3>

<form action="/admin/upload/shopdb"
      method="post"
      enctype="multipart/form-data">

    <input type="file"
           name="dbfile"
           accept=".db">

    <button type="submit">
        上傳 shop.db
    </button>

</form>

<hr>

<h3>上傳 lottery_v2.db</h3>

<form action="/admin/upload/lotterydb"
      method="post"
      enctype="multipart/form-data">

    <input type="file"
           name="dbfile"
           accept=".db">

    <button type="submit">
        上傳 lottery_v2.db
    </button>

</form>

<p>會員數：{{ user_count }}</p>

<p>商品數：{{ product_count }}</p>

<p>訂單數：{{ order_count }}</p>

<p>待出貨：{{ pending_ship }}</p>

<p>今日營收：NT$ {{ today_revenue }}</p>

<p>本月營收：NT$ {{ month_revenue }}</p>

<p>總營收：NT$ {{ total_revenue }}</p>

<hr>

<p>
    <a href="/admin/update_result">
        🎯 開獎管理
    </a>
</p>

<p>
    <a href="/admin/products">
        📦 商品管理
    </a>
</p>

<p>
    <a href="/orders">
        🛒 訂單管理
    </a>
</p>

</body>
</html>
